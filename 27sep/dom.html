<input type="text" id="num" value="5">
<br>
<button onclick="getSqr()">Click Me</button>
<div id="result">This will be updated</div>

<script>
function getSqr(){
    x = document.getElementById("num").value
    output = `Square of ${x} is ${x * x}`
    // alert(output)
    document.getElementById("result").innerHTML = output
}
